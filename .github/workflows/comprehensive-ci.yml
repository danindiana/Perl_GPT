name: Comprehensive CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  # Job 1: Code Quality and Syntax Checks
  quality:
    name: Code Quality & Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Install cpanm
        run: |
          curl -L https://cpanmin.us | perl - App::cpanminus
          cpanm --notest --quiet Perl::Critic Perl::Tidy

      - name: Syntax check all scripts
        run: make syntax-check

      - name: Run Perl::Critic
        run: make critic || true
        continue-on-error: true

  # Job 2: Dependency Testing
  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Install dependencies
        run: |
          curl -L https://cpanmin.us | perl - App::cpanminus
          cpanm --installdeps . --notest --quiet

      - name: Verify dependencies
        run: make deps-check

  # Job 3: Matrix Testing across Perl versions and OS
  test:
    name: Test Suite
    needs: [quality, dependencies]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        perl-version: ['5.30', '5.32', '5.34', '5.36', '5.38']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Perl ${{ matrix.perl-version }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libexpat1-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 expat

      - name: Install Perl dependencies
        run: |
          curl -L https://cpanmin.us | perl - App::cpanminus
          cpanm --installdeps . --with-test --notest --quiet

      - name: Run test suite
        run: make test

      - name: Run smoke tests
        run: make smoke-test
        continue-on-error: true

  # Job 4: Module-Specific Tests
  module-tests:
    name: Module Tests - ${{ matrix.module }}
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - arxiv_doi_grabber
          - entropy_cleaner
          - entropy_nlp
          - jsonl_convertor
          - find_text
          - clean_dupent
          - sshlog_ips
          - dig
          - inference_engine_check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Install dependencies
        run: |
          curl -L https://cpanmin.us | perl - App::cpanminus
          cpanm --installdeps . --notest --quiet

      - name: Test ${{ matrix.module }}
        run: |
          if [ -d "${{ matrix.module }}" ]; then
            cd ${{ matrix.module }}
            # Check syntax of all .pl files
            for script in *.pl; do
              if [ -f "$script" ]; then
                echo "Checking syntax: $script"
                perl -c "$script"
              fi
            done
            # Run module-specific tests if they exist
            if [ -f "smoke_test.pl" ]; then
              echo "Running smoke test..."
              perl smoke_test.pl || true
            fi
          fi

  # Job 5: Documentation Validation
  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for README files
        run: |
          echo "Checking for README files in modules..."
          for dir in */; do
            if [ -d "$dir" ] && [ "$dir" != ".git/" ] && [ "$dir" != ".github/" ]; then
              if [ ! -f "${dir}README.md" ] && [ ! -f "${dir}readme.md" ]; then
                echo "WARNING: No README found in $dir"
              else
                echo "✓ README found in $dir"
              fi
            fi
          done

      - name: Validate Markdown files
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.json
          ignore_path: .markdownlintignore
        continue-on-error: true

  # Job 6: Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Job 7: Coverage Report (optional)
  coverage:
    name: Test Coverage
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Install dependencies
        run: |
          curl -L https://cpanmin.us | perl - App::cpanminus
          cpanm --installdeps . --notest --quiet
          cpanm --notest Devel::Cover

      - name: Generate coverage report
        run: make coverage || true
        continue-on-error: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cover_db/
          retention-days: 7
        if: always()

  # Job 8: Build Validation
  build:
    name: Build & Install Check
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Test installation script
        run: |
          chmod +x install.sh
          # Run install script in non-interactive mode
          echo -e "n\nn\nn" | ./install.sh || true

      - name: Verify Makefile targets
        run: |
          make help
          make clean

  # Job 9: Release preparation (only on tags)
  release-check:
    name: Release Preparation
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, module-tests, documentation]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          echo "Checking version consistency..."
          # Add version checking logic here

      - name: Create release notes draft
        run: |
          echo "# Release Notes" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Changes in this release" >> RELEASE_NOTES.md
          git log --oneline --no-merges $(git describe --tags --abbrev=0 HEAD^)..HEAD >> RELEASE_NOTES.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 30

# Summary notification
  notify:
    name: Pipeline Summary
    needs: [quality, dependencies, test, module-tests, documentation, build]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Pipeline Status
        run: |
          echo "================================================"
          echo "CI/CD Pipeline completed"
          echo "================================================"
          echo "Quality Check: ${{ needs.quality.result }}"
          echo "Dependencies: ${{ needs.dependencies.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Module Tests: ${{ needs.module-tests.result }}"
          echo "Documentation: ${{ needs.documentation.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "================================================"
